<div class="loader-wrapper">
  <div
    class="grid"
    [style.--size.px]="size"
    [style.--gap.px]="gap"
  >
    <span *ngFor="let i of [].constructor(9); let idx = index"
          class="square"
          [style.animationDelay.ms]="idx * 90">
    </span>
  </div>

  <!-- Este cargador sale en las 24 pantallas cada vez que algo se
       procesa, asi que es la imagen que mas se ve de toda la
       aplicacion. Tenia el logo anterior.
       El ancho iba en 10%, o sea 10% del contenedor, que no es una
       medida: en una pantalla ancha el logo salia enorme y en un
       telefono no se leia. Ahora va en pixeles. -->
  <div class="loader-marca">
    <img src="assets/images/brand/rendix-compacto.png" alt="RENDIX">
  </div>
</div>
