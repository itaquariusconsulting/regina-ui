<div class="layout"
     [class.no-sidebar]="!isSidebarVisible"
     [class.menu-flotante]="esPantallaChica">

  <!-- Fondo oscuro detras del menu abierto en pantalla chica: da
       el "toca afuera para cerrar" y separa el menu del contenido. -->
  <div class="sidebar-backdrop"
       *ngIf="esPantallaChica && isSidebarVisible"
       (click)="cerrarMenuLateral()"></div>

  <!-- El *ngIf ya no mira isDesktop: en un telefono tambien tiene
       que poder abrirse con la hamburguesa. -->
  <aside *ngIf="isSidebarVisible" class="sidebar">
    <div class="logo-container">
      <!-- Version sin la bajada: en 150px de ancho "Sistema de
           Rendicion de Cuentas" mide 4px y se ve como una mancha. -->
      <img src="assets/images/brand/rendix-compacto.png" alt="RENDIX">
    </div>
    <app-sidebar></app-sidebar>
  </aside>

  <header class="header">
    <app-default-header (toggleSidebar)="toggleSidebar()"></app-default-header>
  </header>

  <main class="content">
    <div class="content-inner">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Botón flotante Regina -->
  <div *ngIf="showReginaIcon" class="regina-chat-slot" (click)="toggleReginaChat()">

    <img src="assets/images/icono-chatbot.png" alt="Regina" class="regina-chat-icon" />
  </div>

  <!-- Panel de chat -->
  <div class="regina-chat-panel" *ngIf="showReginaChat">

    <div class="regina-chat-header">
      <span>Charla con Regina</span>
      <button type="button" (click)="toggleReginaChat()">✕</button>
    </div>

    <div class="regina-chat-body">

      <div class="regina-messages">
        <div *ngFor="let m of messages" class="msg" [class.user]="m.from === 'user'" [class.bot]="m.from === 'bot'">

          <b>{{ m.from === 'user' ? 'Tú' : 'Regina' }}:</b>
          {{ m.text }}
        </div>

        <!-- 🔥 INDICADOR TYPING -->
        <div *ngIf="isThinking" class="msg bot typing">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

      <div class="regina-input">

        <div class="voice-input-wrapper">

          <input type="text" [(ngModel)]="userInput" placeholder="Escribe a Regina..." [disabled]="isListening"
            (keydown.enter)="enviarTexto()" />

          <div class="voice-wave" *ngIf="isListening"></div>

        </div>

        <button type="button" class="mic" (click)="toggleMic()">

          <i class="fa" [ngClass]="isListening ? 'fa-microphone-slash' : 'fa-microphone'">
          </i>

        </button>

        <button type="button" class="send" (click)="enviarTexto()">➤</button>

      </div>

    </div>
  </div>

</div>

<!-- El pie de escritorio se saco a pedido: ocupaba una franja fija en
     pantallas donde las tablas de reportes ya llegan al borde. El de
     movil se queda porque ahi vive la barra de navegacion. -->
<app-default-footer-mobile *ngIf="!isDesktop"></app-default-footer-mobile>
