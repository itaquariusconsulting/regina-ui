# ===========================================================================
# RENDIX CONCAR - configuracion del front
# ---------------------------------------------------------------------------
# Este archivo reemplaza a config.ini cuando se compila con la configuracion
# "concar" (ver fileReplacements en angular.json).
#
# La diferencia que importa: el RUBRO. En la instalacion de Aquarius es GGENE,
# un rubro del ERP de contabilidad. Aca el unico rubro que existe es OPXRE
# -ENTREGAS POR RENDIR-, que es el que siembra el script de catalogos. Con el
# valor de Aquarius, la pantalla de rendir cuenta preselecciona un rubro que
# no esta en la lista: el combo sale en blanco, el Concepto queda
# deshabilitado y no se puede cargar ningun comprobante.
#
# PENDIENTE DE AJUSTAR POR CLIENTE: las claves ABONO_* traen la cuenta
# bancaria de Aquarius en el BCP. Antes de instalar en casa de un cliente hay
# que reemplazarlas por la cuenta a la que SUS trabajadores devuelven el
# saldo, o la pantalla de devoluciones va a mostrar una cuenta ajena.
# ===========================================================================

COD_RUBRO_MOVILIDAD=OPXRE
COD_TIPO_GASTO_MOVILIDAD=MOV
COD_RUBRO_GENERAL=OPXRE
COD_TIPO_GASTO_GENERAL=
COD_DOCUMENTO_GENERAL=FC
LST_DIVISION_GASTO='9430206','9430207','9430305','9430314','9430303', '9430304'

# === Reglas de Planilla de Movilidad ===
# Importe maximo permitido por dia (en Soles) para gastos de movilidad
PLANILLA_MOVILIDAD_IMPORTE_MAX_DIA=45.20

# === Devolucion de saldo: cuenta a la que depositan los trabajadores ===
# Es una sola y fija. Sale de MAE_BANCO_CUENTA del ERP; si algun dia cambia,
# se cambia aca y no hay que tocar codigo.
ABONO_COD_AUXILIAR_BCO=500973
ABONO_DES_BANCO=BANCO DE CREDITO DEL PERU
ABONO_NUM_CUENTA_BCO=191-1864200-0-02
ABONO_COD_MONEDA=01
# Cuenta contable a la que entra el dinero, para que contabilidad no la busque.
ABONO_COD_CUENTA_CONTABLE=1041118
# La forma de pago es un CODIGO de 4 en el ERP (TES_FORMA_PAGO), no la
# frase. FCBK = ABONO EN CUENTA, y existe igual en las cuatro empresas.
ABONO_COD_FORMA_PAGO=FCBK
ABONO_DES_FORMA_PAGO=ABONO EN CUENTA
